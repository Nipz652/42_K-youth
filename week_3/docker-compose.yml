services:

  # ── Ollama LLM service ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"           
    volumes:
      - ollama_data:/root/.ollama   
    # GPU support feature (uncomment if you have an NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ── Backend service ────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama

  # ── Frontend service ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "8000:8000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  ollama_data:    # named volume so models survive container restarts