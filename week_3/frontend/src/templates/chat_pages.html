<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Helper Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <style>
    body {
      background-color: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      height: 85vh;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e9ecef;
      font-weight: 600;
      font-size: 1rem;
      color: #212529;
      background: #fff;
    }

    /* Scrollable chat history */
    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Bot bubble */
    .bubble-bot {
      align-self: flex-start;
      background: #f1f3f5;
      color: #212529;
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      max-width: 75%;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* User bubble */
    .bubble-user {
      align-self: flex-end;
      background: #5c6bc0;
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      max-width: 75%;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* PDF attachment badge shown in chat */
    .attachment-badge {
      display: inline-block;
      background: #e3f2fd;
      color: #1565c0;
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 0.78rem;
      margin-bottom: 4px;
    }

    /* Input bar */
    .chat-input-bar {
      padding: 12px 16px;
      border-top: 1px solid #e9ecef;
      background: #fff;
    }

    .input-group {
      align-items: center;
    }

    #messageInput {
      border-radius: 24px 0 0 24px !important;
      border: 1px solid #dee2e6;
      padding: 10px 16px;
      font-size: 0.9rem;
      resize: none;
      height: 44px;
    }

    #messageInput:focus {
      box-shadow: none;
      border-color: #5c6bc0;
    }

    #sendBtn {
      border-radius: 0 24px 24px 0 !important;
      background-color: #5c6bc0;
      border-color: #5c6bc0;
      padding: 0 20px;
      height: 44px;
      font-size: 0.9rem;
    }

    #sendBtn:hover {
      background-color: #3f51b5;
      border-color: #3f51b5;
    }

    /* File upload button */
    #uploadBtn {
      background: none;
      border: 1px solid #dee2e6;
      border-radius: 50% !important;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c757d;
      margin-right: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #uploadBtn:hover {
      background: #f1f3f5;
    }

    /* PDF file indicator below input */
    #fileIndicator {
      font-size: 0.78rem;
      color: #5c6bc0;
      margin-top: 6px;
      padding-left: 4px;
      display: none;
    }

    /* Typing indicator */
    .typing-indicator span {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #adb5bd;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
      margin: 0 2px;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<div class="chat-wrapper">

  <!-- Header -->
  <div class="chat-header">
    💼 Resume Helper Chatbot
  </div>

  <!-- Chat history -->
  <div class="chat-history" id="chatHistory">
    <div class="bubble-bot">Hi! How can I help you today?</div>
  </div>

  <!-- Input bar -->
  <div class="chat-input-bar">
    <div class="d-flex align-items-center">
      <!-- Hidden file input -->
      <input type="file" id="pdfInput" accept=".pdf" style="display:none">
      <!-- Upload button -->
      <button id="uploadBtn" title="Attach PDF" onclick="document.getElementById('pdfInput').click()">
        <!-- Upload icon (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
          <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
        </svg>
      </button>
      <div class="input-group flex-grow-1">
        <input type="text" id="messageInput" class="form-control"
               placeholder="Type a message..." autocomplete="off">
        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
    <!-- File indicator -->
    <div id="fileIndicator">📎 <span id="fileName"></span> <a href="#" onclick="clearFile(event)">✕</a></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

<!-- PDF.js for client-side PDF to text extraction -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

<script>
  // Backend URL injected from environment variable via Jinja2
  const BACKEND_URL = "{{ backend_url }}";

  let extractedPdfText = null;
  let attachedFileName = null;

  // ── PDF file selection ──────────────────────────────────────────────
  document.getElementById('pdfInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    attachedFileName = file.name;
    document.getElementById('fileName').textContent = file.name;
    document.getElementById('fileIndicator').style.display = 'block';

    // Extract text from PDF using PDF.js
    try {
      const arrayBuffer = await file.arrayBuffer();
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join(' ') + '\n';
      }
      extractedPdfText = fullText.trim();
    } catch (err) {
      console.error('PDF extraction failed:', err);
      extractedPdfText = null;
      appendBotMessage('⚠️ Failed to read the PDF. Please try another file.');
    }
  });

  function clearFile(e) {
    e.preventDefault();
    extractedPdfText = null;
    attachedFileName = null;
    document.getElementById('pdfInput').value = '';
    document.getElementById('fileIndicator').style.display = 'none';
  }

  // ── Send message ────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text) return;

    // Show user bubble
    appendUserMessage(text, attachedFileName);
    input.value = '';

    // Build payload
    const payload = {
      message: text,
      pdf_text: extractedPdfText || null,
    };

    // Clear attachment after sending
    clearFile({ preventDefault: () => {} });

    // Show typing indicator
    const typingId = showTyping();

    try {
      const response = await fetch(`${BACKEND_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      removeTyping(typingId);

      if (!response.ok) {
        appendBotMessage(`⚠️ Server error: ${response.status}`);
        return;
      }

      const data = await response.json();
      appendBotMessage(data.reply ?? 'No response from server.');

    } catch (err) {
      removeTyping(typingId);
      appendBotMessage('⚠️ Could not reach the backend. Is it running?');
      console.error(err);
    }
  }

  // Send on Enter key (Shift+Enter for newline)
  document.getElementById('messageInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Chat bubble helpers ─────────────────────────────────────────────
  function appendUserMessage(text, fileName) {
    const history = document.getElementById('chatHistory');
    if (fileName) {
      const badge = document.createElement('div');
      badge.className = 'attachment-badge align-self-end';
      badge.textContent = `📎 ${fileName}`;
      history.appendChild(badge);
    }
    const div = document.createElement('div');
    div.className = 'bubble-user';
    div.textContent = text;
    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
  }

  function appendBotMessage(text) {
    const history = document.getElementById('chatHistory');
    const div = document.createElement('div');
    div.className = 'bubble-bot';
    div.textContent = text;
    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
  }

  function showTyping() {
    const history = document.getElementById('chatHistory');
    const div = document.createElement('div');
    div.className = 'bubble-bot typing-indicator';
    div.id = 'typing-' + Date.now();
    div.innerHTML = '<span></span><span></span><span></span>';
    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
    return div.id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }
</script>

</body>
</html>
