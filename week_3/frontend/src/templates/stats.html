<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Market Stats</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  <style>
    body { background: #f0f2f5; }
    .card { border: none; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
    .nav-link.active { background: #5c6bc0 !important; color: #fff !important; border-radius: 8px; }
    .search-result { border-left: 4px solid #5c6bc0; padding: 10px 14px; margin-bottom: 10px;
                     background: #fff; border-radius: 0 8px 8px 0; }
    .badge-skill { background: #e8eaf6; color: #3949ab; border-radius: 20px;
                   padding: 3px 10px; font-size: 0.75rem; margin: 2px; display: inline-block; }
    canvas { max-height: 320px; }
  </style>
</head>
<body>

<div class="container py-4">

  <!-- Nav -->
  <div class="d-flex justify-content-between align-items-center mb-4">

  <div>
    <a href="http://localhost:8080"
       class="btn btn-outline-secondary btn-sm me-2">
      🏠 Home
    </a>
  </div>

  <h4 class="fw-bold mb-0">📊 Job Market Dashboard</h4>

  <div>
    <a href="/"
       class="btn btn-outline-primary btn-sm">
      💬 Chat
    </a>
  </div>

  </div>

  <!-- Tabs -->
  <ul class="nav nav-pills mb-4" id="tabs">
    <li class="nav-item me-2">
      <button class="nav-link active" onclick="showTab('charts')">Charts</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" onclick="showTab('search')">Search Jobs</button>
    </li>
  </ul>

  <!-- Charts tab -->
  <div id="tab-charts">
    <div class="row g-4">

      <!-- Pie chart — top skills -->
      <div class="col-md-6">
        <div class="card p-4">
          <h6 class="fw-semibold mb-3">Top 10 Most Required Skills</h6>
          <canvas id="pieChart"></canvas>
        </div>
      </div>

      <!-- Bar chart — tagged vs untagged -->
      <div class="col-md-6">
        <div class="card p-4">
          <h6 class="fw-semibold mb-3">Job Tagging Distribution</h6>
          <canvas id="barChart"></canvas>
        </div>
      </div>

      <!-- Horizontal bar — skill demand ranking -->
      <div class="col-12">
        <div class="card p-4">
          <h6 class="fw-semibold mb-3">Skill Demand Ranking</h6>
          <canvas id="hbarChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <!-- Search tab -->
  <div id="tab-search" style="display:none">
    <div class="card p-4 mb-4">
      <div class="input-group">
        <input type="text" id="searchInput" class="form-control"
               placeholder="Search by skill or keyword (e.g. Python, Docker)..."
               onkeydown="if(event.key==='Enter') doSearch()">
        <button class="btn text-white" style="background:#5c6bc0" onclick="doSearch()">Search</button>
      </div>
    </div>
    <div id="searchResults"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<script>
  const BACKEND_URL = "{{ backend_url }}";

  // ── Tab switching ──────────────────────────────────────────────────
  function showTab(name) {
    document.getElementById('tab-charts').style.display = name === 'charts' ? '' : 'none';
    document.getElementById('tab-search').style.display  = name === 'search'  ? '' : 'none';
    document.querySelectorAll('#tabs .nav-link').forEach((btn, i) => {
      btn.classList.toggle('active', (i === 0) === (name === 'charts'));
    });
  }

  // ── Colour palette ─────────────────────────────────────────────────
  const PALETTE = [
    '#5c6bc0','#42a5f5','#26c6da','#66bb6a','#ffca28',
    '#ffa726','#ef5350','#ab47bc','#ec407a','#78909c',
  ];

  // ── Load charts on page load ───────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    await loadPieAndHBar();
    await loadBar();
  });

  async function loadPieAndHBar() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/stats/tech-distribution`);
      const data = await res.json();

      // Pie chart
      new Chart(document.getElementById('pieChart'), {
        type: 'pie',
        data: {
          labels: data.labels,
          datasets: [{ data: data.values, backgroundColor: PALETTE }],
        },
        options: {
          plugins: { legend: { position: 'right' } },
        },
      });

      // Horizontal bar — same data, different view
      new Chart(document.getElementById('hbarChart'), {
        type: 'bar',
        data: {
          labels: data.labels,
          datasets: [{
            label: 'Jobs requiring skill',
            data: data.values,
            backgroundColor: PALETTE,
            borderRadius: 6,
          }],
        },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } },
        },
      });

    } catch (err) {
      console.error('Failed to load skill distribution:', err);
    }
  }

  async function loadBar() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/stats/jobs-per-source`);
      const data = await res.json();

      new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels: data.labels,
          datasets: [{
            label: 'Number of jobs',
            data: data.values,
            backgroundColor: ['#66bb6a', '#ef5350'],
            borderRadius: 8,
          }],
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } },
        },
      });

    } catch (err) {
      console.error('Failed to load job distribution:', err);
    }
  }

  // ── Job search ─────────────────────────────────────────────────────
  async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    const container = document.getElementById('searchResults');
    container.innerHTML = '<p class="text-muted">Searching...</p>';

    try {
      const res = await fetch(`${BACKEND_URL}/api/jobs/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();

      if (!data.results || data.results.length === 0) {
        container.innerHTML = '<p class="text-muted">No results found.</p>';
        return;
      }

      container.innerHTML = data.results.map(job => {
        const skills = job.tech_stack
          ? job.tech_stack.split(',').map(s =>
              `<span class="badge-skill">${s.trim()}</span>`).join('')
          : '<span class="text-muted">No tags</span>';

        return `
          <div class="search-result">
            <div class="d-flex justify-content-between mb-1">
              <strong>Job #${job.source_id}</strong>
            </div>
            <div class="mb-2">${skills}</div>
            <small class="text-muted">${job.description || 'No description available.'}</small>
          </div>`;
      }).join('');

    } catch (err) {
      container.innerHTML = '<p class="text-danger">Failed to reach backend.</p>';
    }
  }
</script>

</body>
</html>
